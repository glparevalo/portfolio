<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gabriel Arevalo</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous" />

  <link rel="stylesheet" href="others/css/index.css">
</head>

<body>

<div class="shell">

  <aside class="sidebar">

    <div class="name-block">
      <h1>Gabriel Arevalo</h1>
      <div class="role">Analytics Engineer</div>
      <p class="tagline">Where simplicity flows,<br>efficiency and perfection follow.</p>
    </div>

    <div class="resume-pill">
      <span class="blink"></span>
      <a href="">View my full resume</a>
    </div>

    <div class="divider"></div>

    <nav class="sidebar-nav" aria-label="Page sections">
      <a href="#about"><span class="dot"></span>About Me</a>
      <a href="#experience"><span class="dot"></span>Experience</a>
      <a href="#projects"><span class="dot"></span>Projects</a>
      <a href="#education"><span class="dot"></span>Education</a>
    </nav>

    <div class="divider"></div>

    <div class="contact-row">
      <a href="mailto:gabriellyanearevalo@gmail.com" aria-label="Email">
        <i class="fas fa-envelope"></i>
      </a>
      <a href="https://www.linkedin.com/in/glparevalo/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">
        <i class="fab fa-linkedin"></i>
      </a>
      <a href="https://github.com/glparevalo" target="_blank" rel="noopener noreferrer" aria-label="GitHub">
        <i class="fab fa-github"></i>
      </a>
    </div>

  </aside>

  <main class="main-content">

    <section class="section about" id="about">
      <div class="section-label">About Me</div>
      <div class="about-text" id="about-text"></div>
      <div class="skills-heading">Tech Stack & Tools</div>
      <div class="skills-grid" id="skills-grid"></div>
    </section>

    <section class="section experience" id="experience">
      <div class="section-label">Experience</div>
      <div id="exp-list"></div>
    </section>

    <section class="section projects" id="projects">
      <div class="section-label">Projects</div>
      <div id="proj-list"></div>
      <a class="cta-link" href="https://github.com/glparevalo" target="_blank" rel="noopener noreferrer">
        <i class="fab fa-github"></i> See all on GitHub <i class="fas fa-arrow-right"></i>
      </a>
    </section>

    <section class="section education" id="education">
      <div class="section-label">Education</div>
      <div id="edu-list"></div>
    </section>

    <p class="footer-note reveal">
      Gabriel Arevalo &nbsp;·&nbsp; <span id="year"></span>
    </p>

  </main>

</div>

<script>
  /* ── DATA RENDERING ──────────────────────────────────────────── */
  function render(data) {

    /* About */
    const aboutEl = document.getElementById('about-text');
    data.about.forEach(paragraph => {
      const p = document.createElement('p');
      p.innerHTML = paragraph;
      aboutEl.appendChild(p);
    });

    /* Skills */
    const skillsEl = document.getElementById('skills-grid');
    data.skills.forEach(skill => {
      const div = document.createElement('div');
      div.className = 'skill-item';
      div.innerHTML = `<i class="${skill.icon}"></i>${skill.label}`;
      skillsEl.appendChild(div);
    });

    /* Experience */
    const expEl = document.getElementById('exp-list');
    data.experience.forEach(company => {
      const rolesHTML = company.roles.map(role => {
        const tags = role.stack.map(t => `<span class="tag">${t}</span>`).join('');
        return `
          <div class="role-row">
            <div class="exp-date">${role.dates}</div>
            <div class="role-content">
              <div class="job-title">${role.title}</div>
              <p>${role.description}</p>
              <div class="tags">${tags}</div>
            </div>
          </div>`;
      }).join('');
      
      const card = document.createElement('div');
card.className = 'exp-card reveal multi-role';
card.innerHTML = `
  <div></div>
  <div class="exp-body">
    <h3>${company.company}</h3>
    ${rolesHTML}
  </div>`;

if (company.link) {
  const anchor = document.createElement('a');
  anchor.href = company.link;
  anchor.target = '_blank';
  anchor.rel = 'noopener noreferrer';
  anchor.appendChild(card);
  expEl.appendChild(anchor);
} else {
  expEl.appendChild(card);
}
    });

    /* Projects */
    const projEl = document.getElementById('proj-list');
    data.projects.forEach(project => {
      const tags = project.stack.map(t => `<li>${t}</li>`).join('');
      const thumb = project.cover_image
        ? `<img src="${project.cover_image}" alt="${project.title}" loading="lazy">`
        : `<div class="proj-thumb-placeholder"><i class="fas fa-chart-pie"></i></div>`;
      const arrow = project.link
        ? `<i class="fas fa-arrow-up-right-from-square"></i>`
        : '';

      const card = document.createElement('div');
      card.className = 'proj-card reveal';
      card.innerHTML = `
        <div class="proj-thumb">${thumb}</div>
        <div class="proj-info">
          <h3>${project.title} ${arrow}</h3>
          <p>${project.description}</p>
          <ul class="tags">${tags}</ul>
        </div>`;

      const img = card.querySelector('.proj-thumb img');
      if (img) {
        img.addEventListener('error', () => {
          img.closest('.proj-thumb').innerHTML =
            `<div class="proj-thumb-placeholder"><i class="fas fa-chart-pie"></i><span>No preview</span></div>`;
        });
      }

      if (project.link) {
        const anchor = document.createElement('a');
        anchor.href = project.link;
        anchor.target = '_blank';
        anchor.rel = 'noopener noreferrer';
        anchor.appendChild(card);
        projEl.appendChild(anchor);
      } else {
        projEl.appendChild(card);
      }
    });

    /* Education */
    const eduEl = document.getElementById('edu-list');
    data.education.forEach(entry => {
      const div = document.createElement('div');
      div.className = 'edu-card reveal';
      div.innerHTML = `
        <div class="edu-icon"><i class="fas fa-graduation-cap"></i></div>
        <div class="edu-body">
          <h3>${entry.univ}</h3>
          <div class="program">${entry.program}</div>
          <div class="honor"><i class="fas fa-star"></i>${entry.details}</div>
        </div>`;
      eduEl.appendChild(div);
    });

    /* Footer year */
    document.getElementById('year').textContent = new Date().getFullYear();

  }

  /* ── DATA LOADING ────────────────────────────────────────────── */
  fetch('others/data/data.json')
    .then(res => {
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return res.json();
    })
    .then(data => render(data))
    .catch(err => {
      console.error('Failed to load data.json:', err);
      document.querySelector('.main-content').insertAdjacentHTML(
        'afterbegin',
        `<p style="color:#f66;padding:2rem;font-family:monospace;font-size:0.85rem">
          ⚠ Could not load <code>others/data/data.json</code>.<br>
          Make sure the file exists and you are running through a server, not file://.
        </p>`
      );
    });

  /* ── NAV HIGHLIGHTING ────────────────────────────────────────── */
  const sections = Array.from(document.querySelectorAll('.section'));
  const navLinks  = Array.from(document.querySelectorAll('.sidebar-nav a'));

  function getActiveSection() {
    const trigger = window.innerHeight * 0.6;
    let active = sections[0];
    sections.forEach(sec => {
      if (sec.getBoundingClientRect().top <= trigger) active = sec;
    });
    return active ? active.id : '';
  }

  function updateNav() {
    const id = getActiveSection();
    navLinks.forEach(a => {
      a.classList.toggle('active', a.getAttribute('href') === '#' + id);
    });
  }

  updateNav();
  window.addEventListener('scroll', updateNav, { passive: true });
</script>

</body>
</html>
